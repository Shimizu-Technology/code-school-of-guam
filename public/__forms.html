<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Code School of Guam forms</title></head>
  <body>
    <form name="next-cohort-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="next-cohort-interest">
      <input name="bot-field">
      <input name="name">
      <input type="email" name="email">
      <input type="tel" name="phone">
      <select name="preferred_timing"><option>January 2027</option></select>
      <select name="experience_level"><option>Complete beginner</option></select>
      <textarea name="primary_goal"></textarea>
      <input type="checkbox" name="update_consent" value="yes">
    </form>
    <form name="python-fundamentals-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="python-fundamentals-interest">
      <input name="bot-field">
      <input name="name">
      <input type="email" name="email">
      <select name="experience_level">
        <option value="No experience">No experience</option>
        <option value="Some self-study">Some self-study</option>
        <option value="Some projects">Some projects</option>
      </select>
      <textarea name="goal"></textarea>
      <input type="checkbox" name="update_consent" value="yes">
    </form>
    <form name="focused-courses-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="focused-courses-interest">
      <input name="bot-field">
      <input name="name">
      <input type="email" name="email">
      <select name="first_choice">
        <option value="Python Fundamentals">Python Fundamentals</option>
        <option value="Ruby Fundamentals">Ruby Fundamentals</option>
        <option value="JavaScript Fundamentals">JavaScript Fundamentals</option>
        <option value="Python Automation">Python Automation</option>
        <option value="SQL and Data Basics">SQL and Data Basics</option>
        <option value="Frontend with JavaScript">Frontend with JavaScript</option>
        <option value="APIs with Ruby on Rails">APIs with Ruby on Rails</option>
        <option value="AI Engineering with Python">AI Engineering with Python</option>
        <option value="Agent Workflows for Developers">Agent Workflows for Developers</option>
      </select>
      <textarea name="goal"></textarea>
      <input type="checkbox" name="update_consent" value="yes">
    </form>
  </body>
</html>
